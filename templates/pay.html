<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment | EV Charging Finder</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<style>

body{

background:#f5f5f5;

}


.payment-card{

max-width:500px;

margin:50px auto;

border-radius:15px;

}


.price{

font-size:30px;

font-weight:bold;

color:#198754;

}


</style>


</head>


<body>


<nav class="navbar navbar-dark bg-success">

<div class="container">

<a class="navbar-brand fw-bold">

⚡ EV Charging Finder

</a>


</div>

</nav>



<div class="container">


<div class="card shadow payment-card">


<div class="card-header bg-success text-white text-center">


<h3>

<i class="fa-solid fa-credit-card"></i>

Complete Payment

</h3>


</div>



<div class="card-body">


<h5 class="text-center mb-4">

{{ station.name }}

</h5>



<table class="table">


<tr>

<th>
Location
</th>

<td>
{{ station.location }}
</td>

</tr>



<tr>

<th>
Booking Date
</th>

<td>
{{ booking.booking_date }}
</td>

</tr>



<tr>

<th>
Booking Time
</th>

<td>
{{ booking.booking_time }}
</td>

</tr>



<tr>

<th>
Amount
</th>

<td class="price">

₹{{ "%.2f"|format(amount / 100) }}

</td>

</tr>


</table>



<div class="d-grid gap-2">


<button id="payBtn"
class="btn btn-success btn-lg">


<i class="fa-solid fa-lock"></i>

Pay Now


</button>



<a href="{{ url_for('main.dashboard') }}"
class="btn btn-outline-danger">


Cancel


</a>



</div>


<p class="text-muted mt-3 small text-center">


Secure payment powered by Razorpay


</p>



</div>


</div>


</div>





<script src="https://checkout.razorpay.com/v1/checkout.js"></script>



<script>


let payButton=document.getElementById("payBtn");



let options={


"key":
"{{ razorpay_key_id }}",



"amount":
"{{ amount }}",



"currency":
"INR",



"name":
"EV Charging Finder",



"description":
"EV Charging Station Booking",



"order_id":
"{{ payment.razorpay_order_id }}",



"handler":
function(response){



let form=document.createElement("form");


form.method="POST";


form.action="{{ url_for('main.payment_success') }}";



let data={


"razorpay_payment_id":
response.razorpay_payment_id,


"razorpay_order_id":
response.razorpay_order_id,


"razorpay_signature":
response.razorpay_signature


};



for(let key in data){


let input=document.createElement("input");


input.type="hidden";


input.name=key;


input.value=data[key];


form.appendChild(input);


}



document.body.appendChild(form);


form.submit();



},




"prefill":{


"name":
"{{ current_user.name }}",


"email":
"{{ current_user.email }}",


"contact":
"{{ current_user.phone }}"


},



"theme":{


"color":
"#198754"


},



"modal":{


"ondismiss":
function(){


window.location.href=
"{{ url_for('main.payment_failure') }}";


}


}



};



let razorpay=new Razorpay(options);



payButton.onclick=function(e){


e.preventDefault();


payButton.disabled=true;


payButton.innerHTML=
"Processing Payment...";


razorpay.open();


};



</script>


</body>

</html>
