<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>EV Charging Map</title>



    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Leaflet CSS -->

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css" />


    <style>

        #map {

            height: 600px;
            width: 100%;

            border-radius: 10px;

        }


    </style>


</head>


<body class="bg-light">



<nav class="navbar navbar-dark bg-success">


    <div class="container">


        <a class="navbar-brand"
           href="{{ url_for('main.dashboard') }}">

            ⚡ EV Charging Finder

        </a>



        <a href="{{ url_for('main.dashboard') }}"
           class="btn btn-light">

            Dashboard

        </a>


    </div>


</nav>







<div class="container mt-4">


    <h3 class="mb-3">

        🗺 Nearby Charging Stations

    </h3>




    <button class="btn btn-primary mb-3"
            onclick="getLocation()">

        📍 My Location

    </button>





    <div id="map"></div>



</div>







<!-- Leaflet JS -->

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>





<script>


// Default Chennai location

var map = L.map('map').setView(
    [13.0827,80.2707],
    12
);





L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {

        maxZoom:19,

        attribution:'© OpenStreetMap'

    }

).addTo(map);







// Station markers


{% for station in stations %}


var marker = L.marker(
    [
        {{ station.latitude }},
        {{ station.longitude }}
    ]

).addTo(map);





marker.bindPopup(

    "<h5>{{ station.name }}</h5>" +

    "<p>📍 {{ station.location }}</p>" +

    "<p>🔌 {{ station.charger_type }}</p>" +

    "<p>⚡ Slots: {{ station.available_slots }}/{{ station.total_slots }}</p>" +

    "<a class='btn btn-success btn-sm' href='{{ url_for('main.book', id=station.id) }}'>Book Now</a>"

);



{% endfor %}









// User Location


function getLocation(){


    if(navigator.geolocation){


        navigator.geolocation.getCurrentPosition(

            function(position){


                var lat =
                position.coords.latitude;


                var lon =
                position.coords.longitude;




                map.setView(
                    [lat,lon],
                    15
                );




                L.marker(
                    [lat,lon]
                )

                .addTo(map)

                .bindPopup(
                    "📍 Your Current Location"
                )

                .openPopup();



            }

        );


    }

    else{


        alert(
            "Location not supported"
        );


    }


}



</script>





</body>

</html>
