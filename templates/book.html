<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Charging Slot</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


</head>


<body class="bg-light">



<nav class="navbar navbar-dark bg-success">


    <div class="container">


        <a class="navbar-brand"
           href="{{ url_for('main.home') }}">

            ⚡ EV Charging Finder

        </a>



        <a href="{{ url_for('main.dashboard') }}"
           class="btn btn-light">

            Dashboard

        </a>


    </div>


</nav>








<div class="container mt-5">


    <div class="row justify-content-center">


        <div class="col-md-6">


            <div class="card shadow p-4">



                <h3 class="text-center mb-4">

                    Book Charging Slot

                </h3>





                <div class="mb-3">


                    <h5>

                        {{ station.name }}

                    </h5>


                    <p>

                        📍 {{ station.location }}

                    </p>


                    <p>

                        🔌 Charger Type:

                        {{ station.charger_type }}

                    </p>


                    <p>

                        Available Slots:

                        <b>

                        {{ station.available_slots }}

                        /

                        {{ station.total_slots }}

                        </b>

                    </p>


                </div>







                <form method="POST">





                    <div class="mb-3">


                        <label class="form-label">

                            Booking Date

                        </label>


                        <input

                        type="date"

                        name="date"

                        class="form-control"

                        required>


                    </div>







                    <div class="mb-3">


                        <label class="form-label">

                            Booking Time

                        </label>


                        <input

                        type="time"

                        name="time"

                        class="form-control"

                        required>


                    </div>







                    <button

                    type="submit"

                    class="btn btn-success w-100">


                        Confirm Booking


                    </button>




                </form>





            </div>


        </div>


    </div>


</div>







</body>

</html>
