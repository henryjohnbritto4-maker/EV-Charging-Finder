<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Site Settings - EV Charging Finder</title>

<meta name="viewport" content="width=device-width, initial-scale=1">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">


<style>

body{
    background:#f5f6fa;
}


.sidebar{

    min-height:100vh;
    background:#212529;

}


.sidebar a{

    color:white;
    text-decoration:none;
    display:block;
    padding:12px;

}


.sidebar a:hover{

    background:#343a40;

}


.card{

    border-radius:15px;

}

</style>


</head>


<body>


<div class="container-fluid">


<div class="row">


<!-- Sidebar -->


<div class="col-md-3 col-lg-2 sidebar">


<h4 class="text-white text-center mt-3">

⚡ EV Finder

</h4>


<hr class="text-white">


<a href="{{ url_for('admin.dashboard') }}">

<i class="fa fa-dashboard"></i>

Dashboard

</a>


<a href="{{ url_for('admin.users') }}">

<i class="fa fa-users"></i>

Users

</a>


<a href="{{ url_for('admin.stations') }}">

<i class="fa fa-charging-station"></i>

Stations

</a>


<a href="{{ url_for('admin.bookings') }}">

<i class="fa fa-calendar"></i>

Bookings

</a>


<a href="{{ url_for('admin.site_settings') }}">

<i class="fa fa-gear"></i>

Settings

</a>


<a href="{{ url_for('main.logout') }}">

<i class="fa fa-sign-out"></i>

Logout

</a>


</div>





<!-- Content -->


<div class="col-md-9 col-lg-10 p-4">


<h2>

<i class="fa fa-gear"></i>

Website Settings

</h2>


<hr>




<div class="card shadow p-4">



<form method="POST">



<div class="mb-3">


<label class="form-label">

Website Name

</label>


<input 
type="text"
name="site_name"
class="form-control"
placeholder="EV Charging Finder">


</div>





<div class="mb-3">


<label class="form-label">

Admin Email

</label>


<input 
type="email"
name="site_email"
class="form-control"
placeholder="admin@example.com">


</div>





<div class="mb-3">


<label class="form-label">

Contact Number

</label>


<input 
type="text"
name="phone"
class="form-control"
placeholder="Enter phone number">


</div>





<div class="mb-3">


<label class="form-label">

Address / Location

</label>


<textarea
name="location"
class="form-control"
rows="3"
placeholder="Enter address"></textarea>


</div>





<div class="mb-3">


<label class="form-label">

Logo URL

</label>


<input 
type="text"
name="logo"
class="form-control"
placeholder="Logo path or URL">


</div>





<div class="form-check mb-3">


<input
type="checkbox"
name="maintenance_mode"
class="form-check-input">


<label class="form-check-label">

Enable Maintenance Mode

</label>


</div>





<button class="btn btn-success">


<i class="fa fa-save"></i>

Save Settings


</button>



</form>



</div>


</div>



</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
