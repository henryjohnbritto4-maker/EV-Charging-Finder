<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Add Charging Station</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


</head>


<body class="bg-light">



<nav class="navbar navbar-dark bg-dark">


    <div class="container">


        <a class="navbar-brand"
           href="{{ url_for('admin.dashboard') }}">

            ⚡ EV Admin Panel

        </a>



        <a href="{{ url_for('admin.dashboard') }}"
           class="btn btn-light">

            Back

        </a>


    </div>


</nav>








<div class="container mt-5">


    <div class="row justify-content-center">


        <div class="col-md-7">


            <div class="card shadow p-4">



                <h3 class="text-center mb-4">

                    Add Charging Station

                </h3>






                <form method="POST">





                    <div class="mb-3">


                        <label class="form-label">

                            Station Name

                        </label>


                        <input

                        type="text"

                        name="name"

                        class="form-control"

                        required>


                    </div>







                    <div class="mb-3">


                        <label class="form-label">

                            Location

                        </label>


                        <input

                        type="text"

                        name="location"

                        class="form-control"

                        required>


                    </div>







                    <div class="mb-3">


                        <label class="form-label">

                            Charger Type

                        </label>



                        <select

                        name="charger_type"

                        class="form-select"

                        required>


                            <option value="">

                                Select Charger

                            </option>


                            <option value="AC">

                                AC Charger

                            </option>


                            <option value="DC">

                                DC Charger

                            </option>


                            <option value="Fast">

                                Fast Charger

                            </option>


                        </select>


                    </div>







                    <div class="row">



                        <div class="col-md-6 mb-3">


                            <label class="form-label">

                                Total Slots

                            </label>


                            <input

                            type="number"

                            name="total_slots"

                            class="form-control"

                            required>


                        </div>







                        <div class="col-md-6 mb-3">


                            <label class="form-label">

                                Available Slots

                            </label>


                            <input

                            type="number"

                            name="available_slots"

                            class="form-control"

                            required>


                        </div>



                    </div>









                    <div class="row">



                        <div class="col-md-6 mb-3">


                            <label class="form-label">

                                Latitude

                            </label>


                            <input

                            type="number"

                            step="any"

                            name="latitude"

                            class="form-control"

                            placeholder="13.0827"

                            required>


                        </div>







                        <div class="col-md-6 mb-3">


                            <label class="form-label">

                                Longitude

                            </label>


                            <input

                            type="number"

                            step="any"

                            name="longitude"

                            class="form-control"

                            placeholder="80.2707"

                            required>


                        </div>



                    </div>








                    <button

                    type="submit"

                    class="btn btn-success w-100">


                        Add Station


                    </button>





                </form>





            </div>


        </div>


    </div>


</div>








</body>

</html>
