<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>Reset Password | EV Charging Finder Admin</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<link rel="stylesheet"
href="{{ url_for('static', filename='css/admin.css') }}">

</head>


<body class="bg-light">





<div class="container">


<div class="row justify-content-center align-items-center"
style="min-height:100vh;">



<div class="col-lg-5">





<div class="card shadow-lg border-0">



<div class="card-header bg-success text-white text-center py-4">


<h2>


<i class="fa-solid fa-lock"></i>


Reset Password


</h2>



<p class="mb-0">

Create a new secure password

</p>


</div>







<div class="card-body p-4">





{% with messages=get_flashed_messages(with_categories=true) %}


{% if messages %}


{% for category,message in messages %}


<div class="alert alert-{{category}} alert-dismissible fade show">


{{ message }}


<button type="button"
class="btn-close"
data-bs-dismiss="alert">

</button>


</div>


{% endfor %}


{% endif %}


{% endwith %}








<form method="POST"
action="{{ url_for('admin.reset_password') }}"
id="passwordResetForm">






<input type="hidden"
name="token"
value="{{ token }}">







<div class="mb-3">


<label class="form-label">


New Password


</label>



<div class="input-group">


<span class="input-group-text">


<i class="fa-solid fa-key"></i>


</span>



<input type="password"
class="form-control"
id="password"
name="password"
placeholder="Enter new password"
required>


<button type="button"
class="btn btn-outline-secondary"
onclick="showPassword('password','eye1')">


<i class="fa-solid fa-eye"
id="eye1">

</i>


</button>


</div>


</div>







<div class="mb-3">


<label class="form-label">


Confirm New Password


</label>



<div class="input-group">


<span class="input-group-text">


<i class="fa-solid fa-lock"></i>


</span>



<input type="password"
class="form-control"
id="confirm_password"
name="confirm_password"
placeholder="Confirm password"
required>


<button type="button"
class="btn btn-outline-secondary"
onclick="showPassword('confirm_password','eye2')">


<i class="fa-solid fa-eye"
id="eye2">

</i>


</button>


</div>

</div>
<!-- Password Strength -->


<div class="mb-3">


<label class="form-label">

Password Strength

</label>


<div class="progress">


<div class="progress-bar"
id="strengthBar"
style="width:0%">


</div>


</div>


<small id="strengthText"
class="text-muted">


Enter a password


</small>


</div>







<div class="d-grid">


<button type="submit"
class="btn btn-success btn-lg">


<i class="fa-solid fa-check"></i>


Update Password


</button>


</div>






</form>







<hr>







<div class="text-center">


<a href="{{ url_for('admin.login') }}"
class="btn btn-outline-primary">


<i class="fa-solid fa-arrow-left"></i>


Back to Login


</a>


</div>





</div>


</div>







<div class="text-center mt-4">


<p class="text-muted">


⚡ EV Charging Finder


<br>


Administrator Portal © 2026


</p>


</div>





</div>


</div>


</div>







<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>






<script>


function showPassword(inputId,iconId){


let password=document.getElementById(inputId);


let icon=document.getElementById(iconId);



if(password.type==="password"){


password.type="text";


icon.classList.remove("fa-eye");


icon.classList.add("fa-eye-slash");


}

else{


password.type="password";


icon.classList.remove("fa-eye-slash");


icon.classList.add("fa-eye");


}


}







let passwordInput=document.getElementById("password");


let strengthBar=document.getElementById("strengthBar");


let strengthText=document.getElementById("strengthText");



passwordInput.addEventListener("keyup",function(){


let password=this.value;


let strength=0;



if(password.length>=6){


strength+=25;


}



if(/[A-Z]/.test(password)){


strength+=25;


}



if(/[0-9]/.test(password)){


strength+=25;


}



if(/[^A-Za-z0-9]/.test(password)){


strength+=25;


}



strengthBar.style.width=strength+"%";





if(strength===0){


strengthText.innerHTML="Enter a password";


}


else if(strength<=25){


strengthText.innerHTML="Weak password";


}


else if(strength<=50){


strengthText.innerHTML="Medium password";


}


else if(strength<=75){


strengthText.innerHTML="Good password";


}


else{


strengthText.innerHTML="Strong password";


}



});








document.getElementById("passwordResetForm")
.addEventListener("submit",function(e){



let password=document.getElementById("password").value;


let confirmPassword=document.getElementById("confirm_password").value;





if(password.length < 6){


alert("Password must contain at least 6 characters.");


e.preventDefault();


return;


}





if(password!==confirmPassword){


alert("Password confirmation does not match.");


e.preventDefault();


return;


}



});



</script>





</body>


</html>
