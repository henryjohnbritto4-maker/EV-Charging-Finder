<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Database Backup - EV Charging Finder</title>

<meta name="viewport" content="width=device-width, initial-scale=1">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">


<style>

body{
    background:#f5f6fa;
}

.sidebar{

    min-height:100vh;
    background:#212529;

}


.sidebar a{

    color:white;
    text-decoration:none;
    display:block;
    padding:12px;

}


.sidebar a:hover{

    background:#343a40;

}


.card{

    border-radius:15px;

}

</style>


</head>


<body>


<div class="container-fluid">


<div class="row">


<!-- Sidebar -->


<div class="col-md-3 col-lg-2 sidebar">


<h4 class="text-white text-center mt-3">

⚡ EV Finder

</h4>


<hr class="text-white">



<a href="{{ url_for('admin.dashboard') }}">

<i class="fa fa-dashboard"></i>

Dashboard

</a>



<a href="{{ url_for('admin.users') }}">

<i class="fa fa-users"></i>

Users

</a>



<a href="{{ url_for('admin.stations') }}">

<i class="fa fa-charging-station"></i>

Stations

</a>



<a href="{{ url_for('admin.bookings') }}">

<i class="fa fa-calendar"></i>

Bookings

</a>



<a href="{{ url_for('admin.database_backup') }}">

<i class="fa fa-database"></i>

Database Backup

</a>



<a href="{{ url_for('main.logout') }}">

<i class="fa fa-sign-out"></i>

Logout

</a>


</div>





<!-- Content -->


<div class="col-md-9 col-lg-10 p-4">


<div class="d-flex justify-content-between align-items-center">


<h2>

<i class="fa fa-database"></i>

Database Backup

</h2>


<a href="{{ url_for('admin.create_backup') }}"
class="btn btn-success">


<i class="fa fa-plus"></i>

Create Backup


</a>


</div>


<hr>





<div class="card shadow">


<div class="card-header bg-dark text-white">

Backup History

</div>



<div class="card-body table-responsive">


<table class="table table-bordered table-hover">


<thead class="table-light">


<tr>

<th>ID</th>

<th>Backup Name</th>

<th>Date</th>

<th>Status</th>

<th>Action</th>

</tr>


</thead>



<tbody>



{% for backup in backups %}


<tr>


<td>

{{ backup.id }}

</td>


<td>

{{ backup.name }}

</td>


<td>

{{ backup.created_at }}

</td>


<td>


<span class="badge bg-success">

Completed

</span>


</td>


<td>


<a href="#"
class="btn btn-primary btn-sm">

<i class="fa fa-download"></i>

</a>



<a href="#"
class="btn btn-danger btn-sm">

<i class="fa fa-trash"></i>

</a>


</td>


</tr>



{% else %}



<tr>


<td colspan="5"
class="text-center">


No backup available


</td>


</tr>



{% endfor %}



</tbody>


</table>


</div>


</div>



</div>


</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>


</html>
